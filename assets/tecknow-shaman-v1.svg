<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 900" role="img" aria-labelledby="title desc">
<title id="title">Tecknow Shaman V1 mark</title><desc id="desc">A geometric human face inside an open circuit ring. Warm bone and gold describe the embodied human; cyan marks emergent intelligence and the Eidomancer lens.</desc>
